# PetHope - Production Docker Compose (Standalone for Coolify)
# This file is complete and doesn't require docker-compose.yml

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pethope}
      POSTGRES_USER: ${POSTGRES_USER:-pethope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pethope}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pethope}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # MinIO Object Storage (S3-compatible)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: always

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pethope}:${POSTGRES_PASSWORD:-pethope}@postgres:5432/${POSTGRES_DB:-pethope}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-pethope-images}
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-/storage}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      ENVIRONMENT: production
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  # Nuxt 3 Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-/api}
    depends_on:
      - backend
    restart: always

  # Nginx Reverse Proxy (Traefik routes to this via domain)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    expose:
      - "80"
    networks:
      - default
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pethope.rule=Host(`pethope.life`) || Host(`www.pethope.life`)"
      - "traefik.http.routers.pethope.entrypoints=http,https"
      - "traefik.http.routers.pethope.tls=true"
      - "traefik.http.routers.pethope.tls.certresolver=letsencrypt"
      - "traefik.http.services.pethope.loadbalancer.server.port=80"
    depends_on:
      - backend
      - frontend
      - minio
    restart: always

networks:
  coolify:
    external: true

volumes:
  postgres_data:
  minio_data:
